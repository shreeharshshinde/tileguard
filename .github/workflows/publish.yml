name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Publish packages
        run: |
          pnpm -r --filter='@tileguard/core' publish --no-git-checks --access public
          pnpm -r --filter='@tileguard/shared' publish --no-git-checks --access public
          pnpm -r --filter='@tileguard/tile-rules' publish --no-git-checks --access public
          pnpm -r --filter='@tileguard/style-rules' publish --no-git-checks --access public
          pnpm -r --filter='@tileguard/reporters' publish --no-git-checks --access public
          pnpm -r --filter='@tileguard/config' publish --no-git-checks --access public
          pnpm -r --filter='@tileguard/analysis' publish --no-git-checks --access public
          pnpm -r --filter='@tileguard/cli' publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') }}
